name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Types
        run: mypy src
      - name: Security (SAST)
        run: bandit -r src -q
      - name: Dependency CVEs (SCA)
        run: pip-audit
      - name: Tests with coverage
        run: pytest --cov=jubii7 --cov-report=term-missing --cov-fail-under=85
      - name: Train (fast) and check the model card
        run: jubii7 train --fast
      - name: Invoice check must find the known errors
        run: |
          set +e
          jubii7 check --strict > /dev/null
          test $? -eq 2

  codeql:
    # CodeQL on private repos needs GitHub Advanced Security; runs automatically once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
