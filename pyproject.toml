[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jubii7"
version = "1.0.0"
description = "Bilingual (Arabic/English) invoice reader, rule-based checker and line-item classifier with an API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohammed Sohail" }]
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
tracking = ["mlflow-skinny>=2.12"]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7", "radon>=6", "pandas-stubs"]

[project.scripts]
jubii7 = "jubii7.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------- code quality ----------
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, N naming, SIM simplify,
# C90 complexity, S security (bandit rules), RUF ruff-specific, PL pylint subset
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C90", "S", "RUF", "PLR", "PLW"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]  # magic numbers in rules are documented; Arabic glyphs are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"scripts/make_sample_scan.py" = ["E501"]  # HTML template lines

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jubii7"]
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=jubii7 --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/jubii7/cli.py"]

[tool.setuptools.package-data]
jubii7 = ["web/static/*"]
